name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'egigoka/opencode-claude-memory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/kuitos/opencode-claude-memory.git
          git fetch upstream main --tags

      - name: Rebase fork patches onto upstream
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains the latest upstream main."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rebase upstream/main

      - name: Install dependencies
        run: bun install

      - name: Verify rebased fork
        run: |
          bash -n bin/opencode-memory
          bun test
          bun run build

      - name: Push synchronized main and tags
        run: |
          git push --force-with-lease origin HEAD:main
          git push origin --tags
